<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B5E20">
<title>Finanzas · Sucelly & Pablo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --green:#1B5E20; --green-mid:#2E7D32; --radius:14px; --radius-sm:10px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100vh; background:#F1F4F0; font-family:'DM Sans',sans-serif; }
  .app { max-width:430px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  .header { background:var(--green); padding:52px 20px 20px; }
  .header h1 { font-size:20px; font-weight:600; color:#fff; }
  .header p  { font-size:13px; color:rgba(255,255,255,0.65); margin-top:3px; }

  .body { flex:1; padding:16px; }
  .card { background:#fff; border-radius:var(--radius); padding:16px; margin-bottom:12px; border:1px solid rgba(0,0,0,0.06); }
  .card-label { font-size:11px; font-weight:600; color:#9E9E9E; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px; }

  /* Botones táctiles — divs con touchstart para Android */
  .btn-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .btn-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .sel-btn {
    padding:13px 6px; border-radius:var(--radius-sm);
    border:2px solid #E0E0E0; background:#FAFAFA; color:#757575;
    font-size:14px; font-weight:500; text-align:center;
    font-family:'DM Sans',sans-serif; cursor:pointer;
    user-select:none; -webkit-user-select:none;
    transition:background 0.1s, border-color 0.1s, color 0.1s;
  }
  .sel-btn.span2 { grid-column:span 2; }
  .sel-btn.act-persona { background:#EDE7F6; border-color:#7B1FA2; color:#4A148C; }
  .sel-btn.act-ingreso { background:#E8F5E9; border-color:#2E7D32; color:#1B5E20; }
  .sel-btn.act-gasto   { background:#FFEBEE; border-color:#C62828; color:#B71C1C; }
  .sel-btn.act-ahorro  { background:#E0F7FA; border-color:#00838F; color:#006064; }

  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  .field label { display:block; font-size:12px; font-weight:600; color:#9E9E9E; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
  .field select, .field input, .field textarea {
    width:100%; padding:12px 14px; border-radius:var(--radius-sm);
    border:1.5px solid #E8E8E8; background:#FAFAFA; color:#212121;
    font-size:15px; font-family:'DM Sans',sans-serif;
    -webkit-appearance:none; appearance:none; outline:none;
  }
  .field select:focus,.field input:focus,.field textarea:focus { border-color:var(--green-mid); background:#fff; }
  .field textarea { resize:none; height:70px; line-height:1.5; }
  .monto-wrap { position:relative; }
  .monto-prefix { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; font-weight:600; color:#9E9E9E; pointer-events:none; }
  .monto-wrap input { padding-left:30px; font-weight:600; font-size:18px; }

  .submit-btn {
    width:100%; padding:16px; border-radius:var(--radius);
    background:var(--green); color:#fff; font-size:16px; font-weight:600;
    border:none; cursor:pointer; font-family:'DM Sans',sans-serif; margin-bottom:16px;
  }
  .submit-btn:active { opacity:0.85; }
  .submit-btn:disabled { opacity:0.45; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    padding:12px 22px; border-radius:30px; font-size:14px; font-weight:500;
    display:none; z-index:999; box-shadow:0 4px 20px rgba(0,0,0,0.18);
    white-space:nowrap; font-family:'DM Sans',sans-serif;
  }
  .toast.ok  { background:#1B5E20; color:#fff; display:block; }
  .toast.err { background:#B71C1C; color:#fff; display:block; }

  .hi { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #F5F5F5; gap:10px; }
  .hi:last-child { border-bottom:none; }
  .hi-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot-i{background:#2E7D32;} .dot-g{background:#C62828;} .dot-a{background:#00838F;}
  .hi-info { flex:1; min-width:0; }
  .hi-cat { font-size:14px; font-weight:500; color:#212121; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hi-sub { font-size:11px; color:#9E9E9E; margin-top:2px; }
  .hi-amt { font-size:14px; font-weight:600; flex-shrink:0; }
  .amt-i{color:#2E7D32;} .amt-g{color:#C62828;} .amt-a{color:#00838F;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Registro de finanzas</h1>
    <p>Sucelly &amp; Pablo</p>
  </div>

  <div class="body">

    <!-- PERSONA -->
    <div class="card">
      <div class="card-label">¿Quién registra?</div>
      <div class="btn-grid-3" id="grid-persona">
        <div class="sel-btn" data-val="Sucelly" ontouchstart="selPersona(this)" onclick="selPersona(this)">Sucelly</div>
        <div class="sel-btn" data-val="Pablo"   ontouchstart="selPersona(this)" onclick="selPersona(this)">Pablo</div>
        <div class="sel-btn" data-val="Ambos"   ontouchstart="selPersona(this)" onclick="selPersona(this)">Ambos</div>
      </div>
    </div>

    <!-- TIPO -->
    <div class="card">
      <div class="card-label">Tipo de movimiento</div>
      <div class="btn-grid-2" id="grid-tipo">
        <div class="sel-btn" data-val="Ingreso" ontouchstart="selTipo(this)" onclick="selTipo(this)">↑ Ingreso</div>
        <div class="sel-btn" data-val="Gasto"   ontouchstart="selTipo(this)" onclick="selTipo(this)">↓ Gasto</div>
        <div class="sel-btn span2" data-val="Ahorro" ontouchstart="selTipo(this)" onclick="selTipo(this)">🐖 Ahorro</div>
      </div>
    </div>

    <!-- DETALLE -->
    <div class="card">
      <div class="field">
        <label>Categoría</label>
        <select id="categoria">
          <option value="">— Selecciona el tipo primero —</option>
        </select>
      </div>
      <div class="field">
        <label>Descripción</label>
        <input type="text" id="descripcion" placeholder="Ej. Supermercado La Torre">
      </div>
      <div class="field">
        <label>Monto</label>
        <div class="monto-wrap">
          <span class="monto-prefix">Q</span>
          <input type="number" id="monto" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
        </div>
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label>Observaciones <span style="font-weight:400;text-transform:none;color:#BDBDBD">(opcional)</span></label>
        <textarea id="obs" placeholder="Notas adicionales..."></textarea>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="enviar()">
      Guardar en Google Sheets
    </button>

    <div id="hist-wrap" style="display:none">
      <div class="card">
        <div class="card-label">Esta sesión</div>
        <div id="historial"></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzJdUcMjBpW1tRv9VFZ0ljeDLaqknkkyIwfWUh99eEkgmGdAzo-t8SCnl8Yd19DWH4sHA/exec";

const CATS = {
  Ingreso: ["Salario","Bono","Otro"],
  Gasto:   ["Vivienda","Alimentación","Gasolina","Luz","Internet","Salud","Educación","Mantenimiento","Viajes","Compras","Otro"],
  Ahorro:  ["Cooperativa","Inversión","Fondo Emergencia","Ahorro Voluntario"]
};

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let persona = null, tipo = null, historial = [];

// Fecha de hoy
const hoy = new Date();
document.getElementById("fecha").value = hoy.toISOString().split("T")[0];

function selPersona(el) {
  event && event.preventDefault();
  document.querySelectorAll("#grid-persona .sel-btn").forEach(b => b.classList.remove("act-persona"));
  el.classList.add("act-persona");
  persona = el.dataset.val;
}

function selTipo(el) {
  event && event.preventDefault();
  document.querySelectorAll("#grid-tipo .sel-btn").forEach(b => {
    b.classList.remove("act-ingreso","act-gasto","act-ahorro");
  });
  tipo = el.dataset.val;
  const cls = tipo==="Ingreso"?"act-ingreso": tipo==="Gasto"?"act-gasto":"act-ahorro";
  el.classList.add(cls);

  // Actualizar categorías inmediatamente
  const sel = document.getElementById("categoria");
  sel.innerHTML = CATS[tipo].map(c => `<option value="${c}">${c}</option>`).join("");
}

function showToast(msg, ok) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (ok ? "ok" : "err");
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = "toast"; }, 3500);
}

function fmtFecha(str) {
  const [y,m,d] = str.split("-");
  return `${d}/${m}/${y}`;
}
function getMes(str) {
  const d = new Date(str + "T12:00:00");
  return MESES[d.getMonth()] + " " + d.getFullYear();
}

function renderHistorial() {
  document.getElementById("hist-wrap").style.display = "block";
  document.getElementById("historial").innerHTML = historial.slice(0,6).map(r => {
    const dot = r.tipo==="Ingreso"?"dot-i":r.tipo==="Gasto"?"dot-g":"dot-a";
    const amt = r.tipo==="Ingreso"?"amt-i":r.tipo==="Gasto"?"amt-g":"amt-a";
    const sign = r.tipo==="Ingreso"?"+":r.tipo==="Gasto"?"-":"";
    return `<div class="hi">
      <div class="hi-dot ${dot}"></div>
      <div class="hi-info">
        <div class="hi-cat">${r.categoria}${r.descripcion?" · "+r.descripcion:""}</div>
        <div class="hi-sub">${r.persona} · ${r.fechaFmt}</div>
      </div>
      <div class="hi-amt ${amt}">${sign}Q${parseFloat(r.monto).toFixed(2)}</div>
    </div>`;
  }).join("");
}

async function enviar() {
  const cat   = document.getElementById("categoria").value;
  const monto = document.getElementById("monto").value;
  const fecha = document.getElementById("fecha").value;
  const desc  = document.getElementById("descripcion").value.trim();
  const obs   = document.getElementById("obs").value.trim();

  if (!persona)                        { showToast("Selecciona una persona", false); return; }
  if (!tipo)                           { showToast("Selecciona el tipo", false); return; }
  if (!cat)                            { showToast("Selecciona una categoría", false); return; }
  if (!monto || parseFloat(monto)<=0)  { showToast("Ingresa un monto válido", false); return; }
  if (!fecha)                          { showToast("Selecciona la fecha", false); return; }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Guardando...";

  const fechaFmt = fmtFecha(fecha);
  const datos = {
    fecha: fechaFmt, mes: getMes(fecha),
    persona, tipo, categoria: cat,
    descripcion: desc,
    monto: parseFloat(monto).toFixed(2),
    observaciones: obs
  };

  try {
    await fetch(URL_SCRIPT, {
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(datos)
    });
    showToast("✓ Guardado en Google Sheets", true);
    historial.unshift({...datos, fechaFmt});
    renderHistorial();
    document.getElementById("monto").value = "";
    document.getElementById("descripcion").value = "";
    document.getElementById("obs").value = "";
  } catch(e) {
    showToast("Sin conexión. Intenta de nuevo.", false);
  }

  btn.disabled = false;
  btn.textContent = "Guardar en Google Sheets";
}
</script>
</body>
</html>
